[project]
name = "take-two"
version = "0.1.0"
description = "Deterministic Switch production coordinator"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi==0.121.0",
  "httpx==0.28.1",
  "pydantic==2.12.3",
  "pydantic-settings==2.11.0",
  "PyYAML==6.0.3",
  "uvicorn==0.38.0",
  "tzdata==2025.2",
  "websockets==15.0.1",
]

[dependency-groups]
dev = ["pytest==8.4.2", "pytest-asyncio==1.2.0"]

[tool.pytest.ini_options]
cache_dir = "data/pytest-cache"
testpaths = ["coordinator/tests"]
addopts = "--basetemp=data/pytest-w4-default"
asyncio_mode = "auto"
pythonpath = ["."]
